[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Getting Started Todo App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]   # pycodestyle · pyflakes · bugbear
